name: OpenRouter PR Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect PR diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }} > pr_diff.txt

      - name: Call OpenRouter API
        id: call-ai
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SITE_URL: https://your-site.example # optional
          SITE_NAME: MyGitHubPRReviewer # optional
        run: |
          DIFF=$(jq -Rs . pr_diff.txt)

          RESPONSE=$(curl -s https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -H "HTTP-Referer: $SITE_URL" \
            -H "X-Title: $SITE_NAME" \
            -d "{
                  \"model\": \"openai/gpt-oss-20b:free\",
                  \"messages\": [
                    {
                      \"role\": \"system\", 
                      \"content\": \"You are an experienced senior software engineer performing a thorough review of a GitHub pull request. Your responsibilities: Examine the provided diff carefully. Identify logic errors, hidden bugs, and potential security vulnerabilities. Evaluate performance and resource usage, highlighting optimisation opportunities such as algorithmic improvements or reduced complexity. Suggest improvements for readability, maintainability, and testability.\"
                    },
                    { \"role\": \"user\", 
                      \"content\": $DIFF
                    }
                  ]
                }")
          echo "### Raw OpenRouter response ###"
          echo "$DIFF"           # <— print to Actions log
          echo "### End response ###"
          echo "review_body<<EOF" >> $GITHUB_OUTPUT
          echo "$RESPONSE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post AI review as comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = JSON.parse(process.env.REVIEW_BODY || "{}");
            if (output.error) {
              core.setFailed(`OpenRouter API error: ${output.error.message}`);
              return;
            }
            const comment = output.choices?.[0]?.message?.content || "No review generated.";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
        env:
          REVIEW_BODY: ${{ steps.call-ai.outputs.review_body }}
