name: OpenRouter PR Reviewer (Inline)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write # needed for labels

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect PR diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }} > pr_diff.txt

      - name: Call OpenRouter API
        id: call-ai
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Read entire diff into a JSON string safely
          DIFF=$(jq -Rs . pr_diff.txt)

          # Build the payload entirely with jq to avoid sed escaping issues
          PAYLOAD=$(jq -n --arg diff "$DIFF" '{
            model: "openai/gpt-oss-20b:free",
            messages: [
              {
                role: "system",
                content: "You are an experienced senior software engineer reviewing a GitHub pull request.\n\nReturn **only** valid JSON:\n{\n  \"summary\": \"one paragraph high-level summary\",\n  \"findings\": [\n    {\"path\": \"relative/file/path\", \"line\": <lineNumber>, \"comment\": \"actionable inline comment\"}\n  ],\n  \"critical\": true|false\n}\nFocus on logic, security, and optimization."
              },
              { role: "user", content: $diff }
            ]
          }')

          RESPONSE=$(curl -s https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD")

          echo "### Raw OpenRouter response ###"
          echo "$RESPONSE"
          echo "### End response ###"
          echo "review_body<<EOF" >> $GITHUB_OUTPUT
          echo "$RESPONSE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post Inline Comments
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = JSON.parse(process.env.REVIEW_BODY || "{}");
            if (output.error) {
              core.setFailed(`OpenRouter API error: ${output.error.message}`);
              return;
            }

            const summary = output.choices?.[0]?.message?.content || "{}";
            let parsed;
            try {
              parsed = JSON.parse(summary);
            } catch (e) {
              core.setFailed("Model did not return valid JSON");
              return;
            }

            // Inline comments
            if (Array.isArray(parsed.findings)) {
              for (const f of parsed.findings) {
                await github.rest.pulls.createReviewComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                  body: f.comment,
                  commit_id: context.payload.pull_request.head.sha,
                  path: f.path,
                  line: f.line,
                  side: "RIGHT"
                });
              }
            }

            // Add summary comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### AI Review Summary\n${parsed.summary || "No summary"}`
            });

            // Label and fail if critical
            if (parsed.critical) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ["needs-review"]
              });
              core.setFailed("Critical issues found by AI reviewer");
            }
        env:
          REVIEW_BODY: ${{ steps.call-ai.outputs.review_body }}
