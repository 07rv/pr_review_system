# .github/workflows/openai-pr-reviewer.yml
name: OpenAI PR Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      # 1️⃣  Check out the PR code
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣  Generate the PR diff
      - name: Get pull request diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }} > pr_diff.txt

      # 3️⃣  Call the OpenAI API
      - name: Call OpenAI API
        id: review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Read diff and escape quotes/newlines for JSON
          DIFF=$(sed 's/"/\\"/g' pr_diff.txt | tr '\n' ' ')
          RESPONSE=$(curl -s https://openrouter.ai/api/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d "{
                  \"model\": \"openai/gpt-oss-120b:free\",
                  \"messages\": [
                    {\"role\": \"system\", \"content\": \"You are an experienced software engineer reviewing a GitHub pull request diff. Provide concise review comments and suggestions.\"},
                    {\"role\": \"user\", \"content\": \"$DIFF\"}
                  ]
                }")
          echo "review_body<<EOF" >> $GITHUB_OUTPUT
          echo "$RESPONSE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # 4️⃣  Post the AI review as a comment on the PR
      - name: Post review comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = JSON.parse(process.env.REVIEW_BODY || process.env.review_body);
            const comment = output.choices[0].message.content;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
        env:
          REVIEW_BODY: ${{ steps.review.outputs.review_body }}
